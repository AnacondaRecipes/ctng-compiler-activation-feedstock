anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://gcc.gnu.org/pub/gcc/releases/
      regex: href="gcc-([\d.]+)/"
    packages:
      - gcc_linux-64
      - gcc_linux-aarch64
      - gxx_linux-64
      - gxx_linux-aarch64
      - gfortran_linux-64
      - gfortran_linux-aarch64
      - gcc_bootstrap_linux-64
      - gcc_bootstrap_linux-aarch64
  - github:
      identifier: llvm/llvm-project
      use_max_tag: true
      include_regex: ^llvmorg-\d+\.\d+\.\d+$
      from_pattern: ^llvmorg-(\d+\.\d+)\.\d+$
      to_pattern: \1
    packages:
      - clang_impl_linux-64
      - clang_impl_linux-aarch64
      - clang_linux-64
      - clang_linux-aarch64
      - clangxx_impl_linux-64
      - clangxx_impl_linux-aarch64
      - clangxx_linux-64
      - clangxx_linux-aarch64
